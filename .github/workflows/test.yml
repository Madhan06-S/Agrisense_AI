name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-test:
    name: Backend Hardening & Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: agrisense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev libpq-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Alembic Database Migrations
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/agrisense_test
      run: |
        cd backend && PYTHONPATH=. alembic upgrade head

    - name: Run Pytest Suite with Coverage
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/agrisense_test
        REDIS_URL: redis://localhost:6379/0
        STORAGE_BACKEND: local
        LOCAL_STORAGE_DIR: ./test_data
        SECRET_KEY: github_actions_secure_test_secret_key_32_chars
        ENVIRONMENT: testing
      run: |
        cd backend && PYTHONPATH=. pytest --cov=app --cov-report=xml

    - name: Run Real Broker Integration Test Step
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/agrisense_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: github_actions_secure_test_secret_key_32_chars
        ENVIRONMENT: testing
      run: |
        cd backend && PYTHONPATH=. pytest -m real_broker tests/integration/test_celery_broker.py

  frontend-build:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: |
        cd frontend && npm ci

    - name: Run ESLint
      run: |
        cd frontend && npm run lint

    - name: Run TypeScript Type Check
      run: |
        cd frontend && npx tsc --noEmit

    - name: Run Production Build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
      run: |
        cd frontend && npm run build
