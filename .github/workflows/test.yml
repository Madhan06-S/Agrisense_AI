name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: agrisense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest suite with coverage
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/agrisense_test
        REDIS_URL: redis://localhost:6379/0
        STORAGE_BACKEND: local
        LOCAL_STORAGE_DIR: ./test_data
      run: |
        PYTHONPATH=. pytest --cov=app --cov-report=xml

    - name: Run Load Tests (Locust)
      run: |
        PYTHONPATH=. uvicorn app.main:app --port 8000 &
        server_pid=$!
        sleep 3
        # Run Locust test in headless mode for 10 seconds to verify load profiles
        locust -f tests/load/locustfile.py --headless -u 10 -r 2 --run-time 10s --html locust_report.html --host http://localhost:8000
        kill $server_pid

    - name: Upload Test Coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

    - name: Upload Locust Report
      uses: actions/upload-artifact@v3
      with:
        name: locust-report
        path: locust_report.html
